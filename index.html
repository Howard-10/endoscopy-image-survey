</style><header><h1>内镜图像视觉评价</h1><p>请点击您认为<strong>看起来不像真实采集</strong>的图片，可多选；再次点击取消。图片等比例完整显示；点击图片选中，再次点击取消。</p><p>请查看全部140张后提交。如果没有任何图片需要选择，也可以直接提交。</p><div class="tools"><input id="person" placeholder="您的姓名或研究编号" aria-label="姓名或研究编号"><span id="count"></span><button id="submit">完成并下载答案</button><button id="download">下载答案备份</button><span id="status" role="status"></span></div></header><main id="grid"></main><footer><label><input type="checkbox" id="reviewed"> 我已查看全部图片</label><p>未选中的图片表示未被判断为“不像真实”。答案在此设备自动保存。</p></footer><script>
const KEY='endo140-v2';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.order)){let a=Array.from({length:140},(_,i)=>'Q'+String(i+1).padStart(3,'0'));for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}state={session_id:crypto.randomUUID(),order:a,selected:[],person:'',started_at:new Date().toISOString()}}const selected=new Set(state.selected);person.value=state.person||'';function save(){state.selected=[...selected];state.person=person.value.trim();state.reviewed=reviewed.checked;localStorage.setItem(KEY,JSON.stringify(state));count.textContent='已选 '+selected.size+' / 140 张'}reviewed.checked=!!state.reviewed;person.oninput=save;reviewed.onchange=save;for(const id of state.order){let card=document.createElement('button');card.type='button';card.className='tile';card.setAttribute('aria-label','选择或取消选择图片');card.setAttribute('aria-pressed',selected.has(id));let img=new Image();img.src='images/'+id+'.png?v=2';img.alt='';img.loading='lazy';card.append(img);card.onclick=()=>{selected.has(id)?selected.delete(id):selected.add(id);card.setAttribute('aria-pressed',selected.has(id));save()};grid.append(card)}save();function payload(){save();return{study_version:'endo140-v2',session_id:state.session_id,participant:state.person,started_at:state.started_at,submitted_at:new Date().toISOString(),reviewed:state.reviewed,display_order:state.order,selected_ids:[...selected],answers:state.order.map(id=>({image_id:id,unrealistic:selected.has(id)}))}}download.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'}));a.download='图像评价_'+state.session_id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};submit.onclick=async()=>{download.click();document.getElementById('status').textContent='答案已下载，请将文件发给研究者；当前未启用自动上传';return; if(!person.value.trim()){document.getElementById('status').textContent='请填写姓名或研究编号';return}if(!reviewed.checked){document.getElementById('status').textContent='请确认已查看全部图片';return}submit.disabled=true;document.getElementById('status').textContent='正在提交…';try{let r=await fetch('./api/responses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});if(!r.ok)throw Error();let v=await r.json();document.getElementById('status').textContent='提交成功，答案已保存';state.receipt=v.receipt;save()}catch{document.getElementById('status').textContent='未上传成功，答案已保留；请下载备份'}finally{submit.disabled=false}};

function layoutImages(){const root=document.getElementById('grid');const cards=[...root.querySelectorAll('.tile')];if(!cards.length)return;const width=root.clientWidth-parseFloat(getComputedStyle(root).paddingLeft)-parseFloat(getComputedStyle(root).paddingRight);const gap=width<620?8:10;const target=width<620?170:220;let row=[],ratio=0;const rows=[];for(const card of cards){const dim=imageDimensions[card.querySelector('img').src.split('/').pop().split('.')[0]];const r=dim[0]/dim[1];if(row.length&&Math.abs((width-gap*(row.length-1))/ratio-target)<Math.abs((width-gap*row.length)/(ratio+r)-target)){rows.push(row);row=[];ratio=0}row.push(card);ratio+=r}if(row.length)rows.push(row);root.replaceChildren();rows.forEach((cards,i)=>{const wrap=document.createElement('div');wrap.className='image-row';let sum=cards.reduce((n,c)=>{let d=imageDimensions[c.querySelector('img').src.split('/').pop().split('.')[0]];return n+d[0]/d[1]},0);let h=(width-gap*(cards.length-1))/sum;if(i===rows.length-1)h=Math.min(h,target);cards.forEach(c=>{let d=imageDimensions[c.querySelector('img').src.split('/').pop().split('.')[0]];c.style.width=(h*d[0]/d[1])+'px';c.style.height=h+'px';wrap.append(c)});root.append(wrap)})}
